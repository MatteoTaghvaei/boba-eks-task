apiVersion: apps/v1
kind: Deployment
metadata:
  name: webserver
  namespace: webserver
spec:
  replicas: 2

  selector:
    matchLabels:
      app: webserver

  template:
    metadata:
      labels:
        app: webserver

    spec:
      containers:
        - name: webserver
          image: 173567747318.dkr.ecr.eu-west-2.amazonaws.com/boba-eks-dev-ecr:9d5e2912be7e50d8dd1d9ecc5eaf13846b3fb6da
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi