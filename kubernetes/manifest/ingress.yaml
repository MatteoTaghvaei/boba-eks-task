apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webserver
  namespace: webserver
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - boba.monocloud.tech
      secretName: monocloud-tls

  rules:
    - host: boba.monocloud.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webserver
                port:
                  number: 80